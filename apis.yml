name: Telekinesis.ai
description: >-
  Telekinesis is a Physical AI company building a unified Python SDK and
  large-scale "skill library" for industrial robotics and computer vision. Its
  composable skills span perception (2D/3D detection, segmentation, 6D pose
  estimation, point clouds), planning, control, reinforcement learning, and
  Vision-Language-Model agents that orchestrate complete robotics systems.
  Developers install the official telekinesis-ai SDK from PyPI, authenticate
  with an API key from platform.telekinesis.ai, and run skills either
  cloud-hosted or on-premise. The stack includes BabyROS (a lightweight ROS-style
  pub/sub middleware on Zenoh), a Data Engine for synthetic dataset generation,
  and NVIDIA Isaac Sim integration for simulation-to-real transfer. Telekinesis
  targets high-mix manufacturing use cases such as assembly, machine tending,
  bin picking, CNC loading, and inspection, and is a Techstars portfolio company.
